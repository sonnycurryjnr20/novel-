<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends' Novel Shelf</title>
<style>
  :root {
    --bg: #0a1128;
    --text: #f0f4f8;
    --muted: #9ba4b5;
    --accent: #ff8ab3;
    --header-bg: #0a1128;
    --header-border: #1f2a4a;
    --btn-bg: #141e3b;
    --btn-border: #2a3a66;
    --reader-text: #ffffff;
  }

  [data-theme="light"] {
    --bg: #f4f6f9;
    --text: #1a202c;
    --muted: #4a5568;
    --accent: #d53f8c;
    --header-bg: #ffffff;
    --header-border: #e2e8f0;
    --btn-bg: #edf2f7;
    --btn-border: #cbd5e0;
    --reader-text: #1a202c;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background-color 0.3s, color 0.3s;
  }

  header {
    padding: 1.2rem;
    border-bottom: 1px solid var(--header-border);
    position: sticky;
    top: 0;
    background-color: var(--header-bg);
    z-index: 10;
    transition: background-color 0.3s;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: .8rem;
  }

  h1 { margin: 0; font-size: 1.5rem; }
  
  #theme-toggle {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  .filters { display: flex; gap: .5rem; flex-wrap: wrap; }
  
  .filter-btn {
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    padding: .45rem 1rem;
    font-size: .95rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn.active { 
    border-color: var(--accent); 
    color: var(--accent); 
    font-weight: bold;
  }

  main { padding: 1.5rem 1rem; max-width: 800px; margin: auto; }
  
  .story-card {
    border: 1px solid rgba(128, 128, 128, 0.2);
    border-radius: 14px;
    padding: 1.2rem;
    margin: 0 0 1.2rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s, background-color 0.3s;
  }
  .story-card:active { transform: scale(0.98); }
  
  .story-card h2 { margin: 0 0 .4rem; font-size: 1.2rem; color: var(--reader-text); }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: .8rem; }
  
  .read-btn { 
    background: var(--accent); 
    color: #111; 
    border: 0; 
    font-weight: 700; 
    padding: .5rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
  }
  
  #reader { 
    display: none; 
    padding: 1.5rem;
    border-radius: 14px;
    border: 1px solid rgba(128, 128, 128, 0.2);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background-color 0.3s;
  }
  
  #reader h2 { margin-top: 0; font-size: 1.5rem; color: var(--reader-text); }
  #reader h3 { margin-top: 1.5rem; margin-bottom: 1rem; font-size: 1.2rem; color: var(--reader-text); border-bottom: 1px solid rgba(128,128,128,0.3); padding-bottom: 0.5rem; }
  #reader p { margin: 0 0 1.2rem; font-size: 1.05rem; color: var(--reader-text); }
  
  .reader-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .action-btn { 
    border-radius: 8px; 
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    padding: .5rem 1rem;
    cursor: pointer;
    font-weight: bold;
  }

  #listen-btn { background: var(--accent); color: #111; border: none; }
  
  #chapter-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(128, 128, 128, 0.3);
  }

  .chapter-btn {
    background: var(--accent);
    color: #111;
    border: none;
    padding: .6rem 1rem;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .chapter-btn:disabled {
    background: var(--btn-bg);
    color: var(--muted);
    border: 1px solid var(--btn-border);
    cursor: not-allowed;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header id="main-header">
  <div class="header-top">
    <h1>📚 Friends' Novel Shelf</h1>
    <button id="theme-toggle" title="Toggle Light/Dark Mode">🌙</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="romance">Romance</button>
    <button class="filter-btn" data-filter="normal">Normal</button>
    <button class="filter-btn" data-filter="movies">Movies</button>
  </div>
</header>

<main>
  <section id="list"></section>

  <section id="reader">
    <div class="reader-controls">
      <button class="action-btn" onclick="location.hash=''">← Back</button>
      <button id="listen-btn" class="action-btn">🔊 Listen</button>
    </div>
    <h2 id="reader-title"></h2>
    <div class="meta" id="reader-meta"></div>
    
    <div id="reader-content"></div>

    <div id="chapter-nav">
      <button id="prev-chapter-btn" class="chapter-btn" onclick="changeChapter(-1)">← Previous</button>
      <button id="next-chapter-btn" class="chapter-btn" onclick="changeChapter(1)">Next Chapter →</button>
    </div>
  </section>
</main>

<script>
// --- THEME TOGGLE LOGIC ---
const themeToggleBtn = document.getElementById('theme-toggle');
const htmlElement = document.documentElement;
const mainHeader = document.getElementById('main-header');

const savedTheme = localStorage.getItem('site-theme') || 'dark';
htmlElement.setAttribute('data-theme', savedTheme);
themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

themeToggleBtn.addEventListener('click', () => {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  htmlElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('site-theme', newTheme);
  themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
  
  if (document.getElementById("list").classList.contains("hidden") === false) {
    renderList();
  }
});

// --- TEXT TO SPEECH LOGIC ---
const listenBtn = document.getElementById('listen-btn');
let isSpeaking = false;

function stopSpeech() {
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  isSpeaking = false;
  listenBtn.textContent = "🔊 Listen";
}

listenBtn.addEventListener('click', () => {
  if (!window.speechSynthesis) {
    alert("Sorry, your browser doesn't support text-to-speech.");
    return;
  }

  if (isSpeaking) {
    stopSpeech();
  } else {
    const textToRead = document.getElementById('reader-content').innerText;
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.rate = 0.95; 
    
    utterance.onend = () => {
      isSpeaking = false;
      listenBtn.textContent = "🔊 Listen";
    };

    window.speechSynthesis.speak(utterance);
    isSpeaking = true;
    listenBtn.textContent = "⏹️ Stop";
  }
});

// Colors for DARK mode
const darkColors = [
  '#1c2833', '#2c3e50', '#4b3832', '#2a4b41', '#3b2b4a', '#453f3c',
  '#223644', '#4a2c3a', '#1b4332', '#3e2723', '#1a2a3a', '#4a3b32'
];

// Colors for LIGHT mode (Soft pastels)
const lightColors = [
  '#fff1f2', '#f0f9ff', '#fdf4ff', '#f4f4f5', '#fefce8', '#f0fdf4',
  '#fff7ed', '#f8fafc', '#f5f3ff', '#ecfdf5', '#fef2f2', '#f3f4f6'
];

const listEl = document.getElementById("list");
const readerEl = document.getElementById("reader");
const readerTitle = document.getElementById("reader-title");
const readerMeta = document.getElementById("reader-meta");
const readerContent = document.getElementById("reader-content");

let currentFilter = "all";
let activeStory = null;
let currentChapterIndex = 0;

const prevBtn = document.getElementById("prev-chapter-btn");
const nextBtn = document.getElementById("next-chapter-btn");

function getColorForStory(index) {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const colorsArray = currentTheme === 'dark' ? darkColors : lightColors;
  return colorsArray[index % colorsArray.length];
}

function renderList() {
  listEl.innerHTML = "";

  const shown = stories.filter(s =>
    currentFilter === "all" ? true : s.category === currentFilter
  );

  if (!shown.length) {
    listEl.innerHTML = "<p>No stories here yet.</p>";
    return;
  }

  shown.forEach(story => {
    const card = document.createElement("article");
    card.className = "story-card";

    const originalIndex = stories.findIndex(s => s.id === story.id);
    const color = getColorForStory(originalIndex);
    card.style.backgroundColor = color;

    const title = document.createElement("h2");
    title.textContent = story.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${story.author || "Unknown"} • ${story.category} • ${story.chapters.length} Chapters`;

    const btn = document.createElement("button");
    btn.className = "read-btn";
    btn.textContent = "Read";
    btn.onclick = () => { location.hash = story.id; };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function renderChapter() {
  if (!activeStory) return;
  
  const chapter = activeStory.chapters[currentChapterIndex];
  
  readerContent.innerHTML = "";
  
  const chapterTitle = document.createElement("h3");
  chapterTitle.textContent = chapter.title;
  readerContent.appendChild(chapterTitle);
  
  chapter.content.split(/\n{2,}/).forEach(part => {
    if (!part.trim()) return;
    const p = document.createElement("p");
    p.textContent = part.trim();
    readerContent.appendChild(p);
  });

  prevBtn.disabled = currentChapterIndex === 0;
  nextBtn.disabled = currentChapterIndex === activeStory.chapters.length - 1;

  stopSpeech();
  window.scrollTo(0, 0);
}

function changeChapter(step) {
  currentChapterIndex += step;
  renderChapter();
}

function openStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) {
    location.hash = "";
    return;
  }

  mainHeader.classList.add("hidden");

  activeStory = story;
  currentChapterIndex = 0;

  listEl.classList.add("hidden");
  readerEl.style.display = "block";

  const originalIndex = stories.findIndex(s => s.id === story.id);
  const color = getColorForStory(originalIndex);
  readerEl.style.backgroundColor = color;

  readerTitle.textContent = story.title;
  readerMeta.textContent = `${story.author || "Unknown"} • ${story.category}`;

  renderChapter();
}

function showList() {
  stopSpeech();
  
  mainHeader.classList.remove("hidden");

  activeStory = null;
  readerEl.style.display = "none";
  listEl.classList.remove("hidden");
  renderList();
}

function route() {
  const id = location.hash.replace("#", "");
  if (id) openStory(id);
  else showList();
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList();
  });
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
