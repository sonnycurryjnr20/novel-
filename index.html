<body>

<header>
  <div class="header-top">
    <h1>📚 Friends' Novel Shelf</h1>
    <button id="theme-toggle" title="Toggle Light/Dark Mode">🌙</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="romance">Romance</button>
    <button class="filter-btn" data-filter="normal">Normal</button>
  </div>
</header>

<main>
  <section id="list"></section>

  <section id="reader">
    <div class="reader-controls">
      <button class="action-btn" onclick="location.hash=''">← Back</button>
      <button id="listen-btn" class="action-btn">🔊 Listen</button>
    </div>
    <h2 id="reader-title"></h2>
    <div class="meta" id="reader-meta"></div>
    
    <div id="reader-content"></div>

    <div id="chapter-nav">
      <button id="prev-chapter-btn" class="chapter-btn" onclick="changeChapter(-1)">← Previous</button>
      <button id="next-chapter-btn" class="chapter-btn" onclick="changeChapter(1)">Next Chapter →</button>
    </div>
  </section>
</main>

<script>
// --- THEME TOGGLE LOGIC ---
const themeToggleBtn = document.getElementById('theme-toggle');
const htmlElement = document.documentElement;

const savedTheme = localStorage.getItem('site-theme') || 'dark';
htmlElement.setAttribute('data-theme', savedTheme);
themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

themeToggleBtn.addEventListener('click', () => {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  htmlElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('site-theme', newTheme);
  themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
  
  if (document.getElementById("list").classList.contains("hidden") === false) {
    renderList();
  }
});

// --- TEXT TO SPEECH LOGIC ---
const listenBtn = document.getElementById('listen-btn');
let isSpeaking = false;

function stopSpeech() {
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  isSpeaking = false;
  listenBtn.textContent = "🔊 Listen";
}

listenBtn.addEventListener('click', () => {
  if (!window.speechSynthesis) {
    alert("Sorry, your browser doesn't support text-to-speech.");
    return;
  }

  if (isSpeaking) {
    stopSpeech();
  } else {
    const textToRead = document.getElementById('reader-content').innerText;
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.rate = 0.95; 
    
    utterance.onend = () => {
      isSpeaking = false;
      listenBtn.textContent = "🔊 Listen";
    };

    window.speechSynthesis.speak(utterance);
    isSpeaking = true;
    listenBtn.textContent = "⏹️ Stop";
  }
});

// Colors for DARK mode
const darkColors = [
  '#1c2833', '#2c3e50', '#4b3832', '#2a4b41', '#3b2b4a', '#453f3c',
  '#223644', '#4a2c3a', '#1b4332', '#3e2723', '#1a2a3a', '#4a3b32'
];

// Colors for LIGHT mode (Soft pastels)
const lightColors = [
  '#fff1f2', '#f0f9ff', '#fdf4ff', '#f4f4f5', '#fefce8', '#f0fdf4',
  '#fff7ed', '#f8fafc', '#f5f3ff', '#ecfdf5', '#fef2f2', '#f3f4f6'
];

const listEl = document.getElementById("list");
const readerEl = document.getElementById("reader");
const readerTitle = document.getElementById("reader-title");
const readerMeta = document.getElementById("reader-meta");
const readerContent = document.getElementById("reader-content");

let currentFilter = "all";
let activeStory = null;
let currentChapterIndex = 0;

const prevBtn = document.getElementById("prev-chapter-btn");
const nextBtn = document.getElementById("next-chapter-btn");

function getColorForStory(index) {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const colorsArray = currentTheme === 'dark' ? darkColors : lightColors;
  return colorsArray[index % colorsArray.length];
}

function renderList() {
  listEl.innerHTML = "";

  const shown = stories.filter(s =>
    currentFilter === "all" ? true : s.category === currentFilter
  );

  if (!shown.length) {
    listEl.innerHTML = "<p>No stories here yet.</p>";
    return;
  }

  shown.forEach(story => {
    const card = document.createElement("article");
    card.className = "story-card";

    const originalIndex = stories.findIndex(s => s.id === story.id);
    const color = getColorForStory(originalIndex);
    card.style.backgroundColor = color;

    const title = document.createElement("h2");
    title.textContent = story.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${story.author || "Unknown"} • ${story.category} • ${story.chapters.length} Chapters`;

    const btn = document.createElement("button");
    btn.className = "read-btn";
    btn.textContent = "Read";
    btn.onclick = () => { location.hash = story.id; };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function renderChapter() {
  if (!activeStory) return;
  
  const chapter = activeStory.chapters[currentChapterIndex];
  
  // Update Content
  readerContent.innerHTML = "";
  
  const chapterTitle = document.createElement("h3");
  chapterTitle.textContent = chapter.title;
  readerContent.appendChild(chapterTitle);
  
  chapter.content.split(/\n{2,}/).forEach(part => {
    if (!part.trim()) return;
    const p = document.createElement("p");
    p.textContent = part.trim();
    readerContent.appendChild(p);
  });

  // Update Buttons
  prevBtn.disabled = currentChapterIndex === 0;
  nextBtn.disabled = currentChapterIndex === activeStory.chapters.length - 1;

  // Reset TTS if moving chapters
  stopSpeech();
  window.scrollTo(0, 0);
}

function changeChapter(step) {
  currentChapterIndex += step;
  renderChapter();
}

function openStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) {
    location.hash = "";
    return;
  }

  activeStory = story;
  currentChapterIndex = 0;

  listEl.classList.add("hidden");
  readerEl.style.display = "block";

  const originalIndex = stories.findIndex(s => s.id === story.id);
  const color = getColorForStory(originalIndex);
  readerEl.style.backgroundColor = color;

  readerTitle.textContent = story.title;
  readerMeta.textContent = `${story.author || "Unknown"} • ${story.category}`;

  renderChapter();
}

function showList() {
  stopSpeech();
  activeStory = null;
  readerEl.style.display = "none";
  listEl.classList.remove("hidden");
  renderList();
}

function route() {
  const id = location.hash.replace("#", "");
  if (id) openStory(id);
  else showList();
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList();
  });
});

window.addEventListener("hashchange", route);
route();
</script>
