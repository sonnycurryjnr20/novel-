<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends novel shelf</title>
<style>
  :root {
    --bg: #111;
    --card: #1c1c1c;
    --text: #eee;
    --muted: #aaa;
    --accent: #ff8ab3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 1.2rem;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  h1 { margin: 0 0 .6rem; font-size: 1.4rem; }
  .filters { display: flex; gap: .5rem; flex-wrap: wrap; }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid #444;
    border-radius: 999px;
    padding: .45rem .8rem;
    font-size: .95rem;
  }
  button.active { border-color: var(--accent); color: var(--accent); }
  main { padding: 1rem; max-width: 800px; margin: auto; }
  .story-card {
    background: var(--card);
    border: 1px solid #333;
    border-radius: 14px;
    padding: 1rem;
    margin: 0 0 1rem;
  }
  .story-card h2 { margin: 0 0 .3rem; font-size: 1.1rem; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: .6rem; }
  .read-btn { background: var(--accent); color: #111; border: 0; font-weight: 700; }
  #reader { display: none; }
  #reader h2 { margin-top: 0; }
  #reader p { margin: 0 0 1rem; }
  .back { margin-bottom: 1rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>📚 Friends' Novel Shelf</h1>
  <div class="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="romance">Romance</button>
    <button class="filter" data-filter="normal">Normal</button>
  </div>
</header>

<main>
  <section id="list"></section>

  <section id="reader">
    <button class="back" onclick="location.hash=''">← Back to shelf</button>
    <h2 id="reader-title"></h2>
    <div class="meta" id="reader-meta"></div>
    <div id="reader-content"></div>
  </section>
</main>

<script>
// Add your stories here.
// category must be "romance" or "normal".
const stories = [
  {
    id: "moonlight-letters",
    title: "Moonlight Letters",
    author: "You",
    category: "romance",
    content: `The first letter arrived on a Tuesday.

She didn't know who sent it, but the handwriting looked familiar.

Every week, another letter came. Every week, she fell a little more in love with the stranger behind the ink.`
  },
  {
    id: "the-forest-road",
    title: "The Forest Road",
    author: "Your Friend",
    category: "normal",
    content: `The road through the forest was quiet.

Too quiet.

He checked his phone. No signal. The trees seemed taller than they had been a minute ago.

Then he heard footsteps behind him.`
  }
];

const listEl = document.getElementById("list");
const readerEl = document.getElementById("reader");
const readerTitle = document.getElementById("reader-title");
const readerMeta = document.getElementById("reader-meta");
const readerContent = document.getElementById("reader-content");

let currentFilter = "all";

function renderList() {
  listEl.innerHTML = "";

  const shown = stories.filter(s =>
    currentFilter === "all" ? true : s.category === currentFilter
  );

  if (!shown.length) {
    listEl.innerHTML = "<p>No stories here yet.</p>";
    return;
  }

  shown.forEach(story => {
    const card = document.createElement("article");
    card.className = "story-card";

    const title = document.createElement("h2");
    title.textContent = story.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${story.author || "Unknown"} • ${story.category}`;

    const btn = document.createElement("button");
    btn.className = "read-btn";
    btn.textContent = "Read";
    btn.onclick = () => { location.hash = story.id; };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function openStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) {
    location.hash = "";
    return;
  }

  listEl.classList.add("hidden");
  readerEl.style.display = "block";

  readerTitle.textContent = story.title;
  readerMeta.textContent = `${story.author || "Unknown"} • ${story.category}`;

  readerContent.innerHTML = "";
  story.content.split(/\n{2,}/).forEach(part => {
    if (!part.trim()) return;
    const p = document.createElement("p");
    p.textContent = part.trim();
    readerContent.appendChild(p);
  });

  window.scrollTo(0, 0);
}

function showList() {
  readerEl.style.display = "none";
  listEl.classList.remove("hidden");
  renderList();
}

function route() {
  const id = location.hash.replace("#", "");
  if (id) openStory(id);
  else showList();
}

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList();
  });
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
