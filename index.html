"Keep your voice down," Ekow whispered, his eyes darting to the classroom door. "I need your help. The school isn't what you think it is. They're watching the science block tonight."

Before Kwame could ask a single question, the classroom door swung open, and the Chemistry teacher walked back in. Ekow instantly pulled the notebook back, resumed his silent, staring posture, and picked up his pipette.

    content: `In every SHS boarding house, there are rules. Lights out at 10:00 PM. No noise in the corridors. No leaving your dorm after the prefect does the final check.

Ama slipped out of bed and tiptoed across the cold tile floor. She pushed the curtain aside. The campus was bathed in silver moonlight, but there was no one there. Just the swaying branches of the old mango tree.

She let out a relieved breath and turned back to her bed. That's when she saw it. 

A slip of paper slid under the dormitory door. 

Ama crept toward the door and snatched it up. Her hands were trembling. It read: Look under the third bed.

Against her better judgment, Ama walked to the third bed in the room. She knelt down aching against the hard floor. She reached her hand into the shadows. Her fingers brushed against something cold and metallic. 

She pulled it out. It was a rusted, old key with a tag attached to it. 

The tag read: The Headmaster's Office.

Ama's blood ran cold. Why would someone slip this under her door? Was this a prank? Or was it a trap? 

Suddenly, the heavy footsteps of the night watchman echoed in the hallway outside. The beam of a flashlight swept under her door.

Ama squeezed the key tightly in her fist, scrambled back into bed, and pulled the covers over her head. She stayed awake until dawn, listening to the watchman's footsteps, holding the secret key that was going to change her entire term.`

const listEl = document.getElementById("list");
const readerEl = document.getElementById("reader");
const readerTitle = document.getElementById("reader-title");
const readerMeta = document.getElementById("reader-meta");
const readerContent = document.getElementById("reader-content");

let currentFilter = "all";

function renderList() {
  listEl.innerHTML = "";

  const shown = stories.filter(s =>
    currentFilter === "all" ? true : s.category === currentFilter
  );

  if (!shown.length) {
    listEl.innerHTML = "<p>No stories here yet.</p>";
    return;
  }

  shown.forEach(story => {
    const card = document.createElement("article");
    card.className = "story-card";

    const title = document.createElement("h2");
    title.textContent = story.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${story.author || "Unknown"} • ${story.category}`;

    const btn = document.createElement("button");
    btn.className = "read-btn";
    btn.textContent = "Read";
    btn.onclick = () => { location.hash = story.id; };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function openStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) {
    location.hash = "";
    return;
  }

  listEl.classList.add("hidden");
  readerEl.style.display = "block";

  readerTitle.textContent = story.title;
  readerMeta.textContent = `${story.author || "Unknown"} • ${story.category}`;

  readerContent.innerHTML = "";
  story.content.split(/\n{2,}/).forEach(part => {
    if (!part.trim()) return;
    const p = document.createElement("p");
    p.textContent = part.trim();
    readerContent.appendChild(p);
  });

  window.scrollTo(0, 0);
}

function showList() {
  readerEl.style.display = "none";
  listEl.classList.remove("hidden");
  renderList();
}

function route() {
  const id = location.hash.replace("#", "");
  if (id) openStory(id);
  else showList();
}

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList();
  });
});

window.addEventListener("hashchange", route);
route();
</script>
