<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends' Novel Shelf</title>
<style>
  :root {
    --bg: #0a1128;
    --text: #f0f4f8;
    --muted: #9ba4b5;
    --accent: #ff8ab3;
    --header-bg: #0a1128;
    --header-border: #1f2a4a;
    --btn-bg: #141e3b;
    --btn-border: #2a3a66;
    --reader-text: #ffffff;
  }

  [data-theme="light"] {
    --bg: #f4f6f9;
    --text: #1a202c;
    --muted: #4a5568;
    --accent: #d53f8c;
    --header-bg: #ffffff;
    --header-border: #e2e8f0;
    --btn-bg: #edf2f7;
    --btn-border: #cbd5e0;
    --reader-text: #1a202c;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background-color 0.3s, color 0.3s;
  }

  header {
    padding: 1.2rem;
    border-bottom: 1px solid var(--header-border);
    position: sticky;
    top: 0;
    background-color: var(--header-bg);
    z-index: 10;
    transition: background-color 0.3s;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: .8rem;
  }

  h1 { margin: 0; font-size: 1.5rem; }
  
  #theme-toggle {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  .filters { display: flex; gap: .5rem; flex-wrap: wrap; }
  
  .filter-btn {
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    padding: .45rem 1rem;
    font-size: .95rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .filter-btn.active { 
    border-color: var(--accent); 
    color: var(--accent); 
    font-weight: bold;
  }

  main { padding: 1.5rem 1rem; max-width: 800px; margin: auto; }
  
  .story-card {
    border: 1px solid rgba(128, 128, 128, 0.2);
    border-radius: 14px;
    padding: 1.2rem;
    margin: 0 0 1.2rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.2s, background-color 0.3s;
  }
  .story-card:active { transform: scale(0.98); }
  
  .story-card h2 { margin: 0 0 .4rem; font-size: 1.2rem; color: var(--reader-text); }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: .8rem; }
  
  .read-btn { 
    background: var(--accent); 
    color: #111; 
    border: 0; 
    font-weight: 700; 
    padding: .5rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
  }
  
  #reader { 
    display: none; 
    padding: 1.5rem;
    border-radius: 14px;
    border: 1px solid rgba(128, 128, 128, 0.2);
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background-color 0.3s;
  }
  
  #reader h2 { margin-top: 0; font-size: 1.5rem; color: var(--reader-text); }
  #reader h3 { margin-top: 1.5rem; margin-bottom: 1rem; font-size: 1.2rem; color: var(--reader-text); border-bottom: 1px solid rgba(128,128,128,0.3); padding-bottom: 0.5rem; }
  #reader p { margin: 0 0 1.2rem; font-size: 1.05rem; color: var(--reader-text); }
  
  .reader-controls {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .action-btn { 
    border-radius: 8px; 
    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    padding: .5rem 1rem;
    cursor: pointer;
    font-weight: bold;
  }

  #listen-btn { background: var(--accent); color: #111; border: none; }
  
  #chapter-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(128, 128, 128, 0.3);
  }

  .chapter-btn {
    background: var(--accent);
    color: #111;
    border: none;
    padding: .6rem 1rem;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  .chapter-btn:disabled {
    background: var(--btn-bg);
    color: var(--muted);
    border: 1px solid var(--btn-border);
    cursor: not-allowed;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header id="main-header">
  <div class="header-top">
    <h1>📚 Friends' Novel Shelf</h1>
    <button id="theme-toggle" title="Toggle Light/Dark Mode">🌙</button>
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="romance">Romance</button>
    <button class="filter-btn" data-filter="normal">Normal</button>
    <!-- NEW MOVIES FILTER -->
    <button class="filter-btn" data-filter="movies">Movies</button>
  </div>
</header>

<main>
  <section id="list"></section>

  <section id="reader">
    <div class="reader-controls">
      <button class="action-btn" onclick="location.hash=''">← Back</button>
      <button id="listen-btn" class="action-btn">🔊 Listen</button>
    </div>
    <h2 id="reader-title"></h2>
    <div class="meta" id="reader-meta"></div>
    
    <div id="reader-content"></div>

    <div id="chapter-nav">
      <button id="prev-chapter-btn" class="chapter-btn" onclick="changeChapter(-1)">← Previous</button>
      <button id="next-chapter-btn" class="chapter-btn" onclick="changeChapter(1)">Next Chapter →</button>
    </div>
  </section>
</main>

<script>
// --- THEME TOGGLE LOGIC ---
const themeToggleBtn = document.getElementById('theme-toggle');
const htmlElement = document.documentElement;
const mainHeader = document.getElementById('main-header');

const savedTheme = localStorage.getItem('site-theme') || 'dark';
htmlElement.setAttribute('data-theme', savedTheme);
themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

themeToggleBtn.addEventListener('click', () => {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  htmlElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('site-theme', newTheme);
  themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
  
  if (document.getElementById("list").classList.contains("hidden") === false) {
    renderList();
  }
});

// --- TEXT TO SPEECH LOGIC ---
const listenBtn = document.getElementById('listen-btn');
let isSpeaking = false;

function stopSpeech() {
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  isSpeaking = false;
  listenBtn.textContent = "🔊 Listen";
}

listenBtn.addEventListener('click', () => {
  if (!window.speechSynthesis) {
    alert("Sorry, your browser doesn't support text-to-speech.");
    return;
  }

  if (isSpeaking) {
    stopSpeech();
  } else {
    const textToRead = document.getElementById('reader-content').innerText;
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.rate = 0.95; 
    
    utterance.onend = () => {
      isSpeaking = false;
      listenBtn.textContent = "🔊 Listen";
    };

    window.speechSynthesis.speak(utterance);
    isSpeaking = true;
    listenBtn.textContent = "⏹️ Stop";
  }
});

// --- HELPER FUNCTION FOR MASSIVE NOVELS ---
function createLongStory(id, title, author, category, totalChapters, firstChapterText) {
  const chapters = [];
  for (let i = 1; i <= totalChapters; i++) {
    chapters.push({
      title: `Chapter ${i}`,
      content: i === 1 ? firstChapterText : `This is Chapter ${i} of ${title}.\n\n(Note: Since a real novel of ${totalChapters} chapters would be thousands of pages long, this is placeholder text to show the structure. You can edit your index.html file on GitHub and replace this text with your actual story!)`
    });
  }
  return { id, title, author, category, chapters };
}

// --- STORY DATA ---
const stories = [
  // --- MOVIE NOVELIZATIONS ---
  createLongStory(
    "cinderella",
    "Cinderella",
    "Disney",
    "movies",
    10,
    `Once upon a time, in a faraway kingdom, there lived a kind and gentle girl named Ella. She lived in a beautiful manor with her loving parents. But tragedy struck, and soon, Ella was left in the care of her cruel stepmother and two jealous stepsisters.

They stripped her of her fine clothes, forced her to work day and night, and covered her in ashes. They mocked her and called her Cinderella.

But Cinderella never lost her kindness. She kept a small, brave mouse named Gus as her friend and dreamed of a life beyond the dusty attic.

One day, the King announced a grand ball at the palace. Every eligible maiden in the land was invited, including Cinderella. But her stepmother forbade her to go, tearing her mother's old dress to shreds. 

Heartbroken, Cinderella ran to the garden, crying. Suddenly, the air shimmered with golden light. A beautiful woman appeared, surrounded by sparkles. 

"I am your Fairy Godmother," she said softly. "And you, my dear, shall go to the ball."`
  ),
  createLongStory(
    "frozen",
    "Frozen",
    "Disney",
    "movies",
    12,
    `The kingdom of Arendelle was a place of fjords, mountains, and deep, icy secrets. Princess Elsa possessed a magical power—the ability to create ice and snow with a single touch. But as a child, she accidentally hurt her younger sister, Anna. 

Fearing her powers, their parents locked the castle gates. Elsa isolated herself, wearing gloves to hide her magic, while Anna grew up lonely, not remembering why her sister pushed her away.

Years later, on the day of Elsa's coronation, the castle gates were finally opened. Anna was thrilled, dreaming of finding true love. But during a heated argument, Elsa's emotions got the best of her. She accidentally unleashed a frozen spell, plunging the entire kingdom into an eternal winter.

Terrified of what she had done, Elsa fled to the North Mountain. Anna, determined to save her sister and the kingdom, set off into the blizzard with a rugged ice harvester named Kristoff and his loyal reindeer, Sven.`
  ),
  createLongStory(
    "moana",
    "Moana",
    "Disney",
    "movies",
    15,
    `The ocean was always calling to Moana. From the moment she was a toddler, the water seemed to part for her, inviting her in. But her father, the Chief of the island of Motunui, forbade anyone from sailing beyond the reef. The ocean was dangerous, he said.

Moana grew up learning the ways of her people, but her heart ached for the horizon. Then, the island began to die. The fish disappeared, the coconuts turned black, and the lush vegetation wilted.

Moana discovered a dark secret: long ago, the demigod Maui stole the heart of Te Fiti, the goddess of life. Without it, a slow death was spreading across the ocean. 

Guided by her eccentric grandmother, Moana learned that the ocean had chosen her. She packed a canoe, set sail past the reef, and embarked on a daring journey to find Maui, return the heart, and save her people.`
  ),
  createLongStory(
    "the-incredibles",
    "The Incredibles",
    "Disney/Pixar",
    "movies",
    10,
    `In a world where superheroes were once celebrated, they are now forced into hiding. After a series of lawsuits ruined their reputation, the government initiated the Superhero Relocation Program. 

Bob Parr, formerly known as the powerful Mr. Incredible, now works a boring desk job at an insurance company. His wife, Helen (formerly Elastigirl), stays at home to raise their three children: Violet, who can turn invisible; Dash, who is impossibly fast; and baby Jack-Jack.

Bob misses the glory days. He sneaks out with his friend Lucius (Frozone) to fight crime in secret, disobeying the law. 

One day, Bob receives a mysterious message from a woman named Mirage. She offers him a secret, high-paying job on a remote island. But when Bob arrives, he discovers a dangerous plot orchestrated by an old, resentful fan. Now, the Parr family must come out of hiding and learn to fight together.`
  ),
  createLongStory(
    "paw-patrol",
    "Paw Patrol",
    "Nickelodeon",
    "movies",
    8,
    `In the bustling town of Adventure Bay, there was always someone who needed help. Whether it was a kitten stuck in a tree or a train stuck on a broken bridge, the citizens knew exactly who to call: The Paw Patrol.

Led by a ten-year-old boy named Ryder, the Paw Patrol was a team of search-and-rescue dogs, each with a unique job and a high-tech vehicle. 

Chase was the police pup, Marshall was the clumsy but brave fire pup, Skye flew the helicopter, Rubble drove the bulldozer, Rocky recycled, and Zuma handled the water rescues.

But today, a massive storm was brewing on the horizon. The Mayor called Ryder with an emergency: the Adventure Bay lighthouse was struck by lightning, and the beacon was broken. Without the light, ships would crash into the rocky shores at night! 

"Ryder, we need to fix the lighthouse!" Chase barked. 

"No job is too big, no pup is too small!" Ryder declared. "Paw Patrol, to the Lookout!"`
  ),

  // --- EXISTING MASSIVE NOVELS ---
  createLongStory(
    "the-ceos-secret",
    "The CEO's Secret",
    "Anonymous",
    "romance",
    32,
    `The rain hammered against the glass windows of the high-rise office. Amara stood nervously outside the CEO's door, clutching the file that would determine her fate. She had only been an intern for three weeks, and she was already being called into the lion's den.

Taking a deep breath, she knocked. A deep voice from inside said, "Come in."

She pushed the door open. Sitting behind the massive mahogany desk was Kwame Adu, the youngest billionaire in the country. He didn't look up from his laptop. "You're late, Miss Amara."

"I don't care about the traffic," he said, finally looking up. His eyes were dark, piercing. "I care about results. You found a mistake in the merger contract. Tell me how you did it."`
  ),
  createLongStory(
    "haunted-dormitory",
    "The Haunted Dormitory",
    "Anonymous",
    "normal",
    40,
    `No one had slept in Room 404 for over a decade. The school had boarded up the windows, but the whispers still echoed through the halls at midnight. 

When the new students arrived, they were warned: never go to the fourth floor. 

But Mensah didn't believe in ghosts. He needed a quiet place to study for his final exams. Sneaking past the night watchman was easy. Finding the door to Room 404 unlocked was even easier.

He stepped inside. The room smelled of old wood and dust. He set up his books on an old desk. But as the clock struck midnight, he heard a sound. 

Scratch. Scratch. Scratch.

It was coming from inside the wardrobe.`
  ),
  createLongStory(
    "the-lost-city",
    "The Lost City",
    "Anonymous",
    "normal",
    50,
    `The map was drawn in blood on a piece of old parchment. Professor Mensah said it led to a city buried beneath the Sahara, a place that defied all history books. 

Our expedition team had no idea we were walking into a nightmare. There were five of us: the Professor, two local guides, my best friend Kofi, and me. 

On the third day, the sandstorm hit. We lost the guides. We lost our camels. We were left with nothing but the clothes on our backs and the map. 

Then, through the blinding dust, we saw them. Massive stone pillars, carved with eyes that seemed to follow us. We had found the city. But the city was not empty.`
  ),
  createLongStory(
    "love-in-the-time-of-war",
    "Love in the Time of War",
    "Anonymous",
    "romance",
    58,
    `The sirens blared across the city, a sound they had all grown terrifyingly used to. Kofi grabbed Maya's hand, pulling her into the underground bunker just as the first explosion shook the earth.

They sat huddled in the dark, the ground trembling beneath them. Maya was crying. 

"Hey," Kofi whispered, wiping a tear from her cheek. "Look at me. We're going to be okay."

"How do you know?" she sobbed.

"Because I promised you I'd get you out of this city, didn't I?" He pulled a crumpled train ticket from his pocket. "I bought these three months ago. Two tickets to the border. We leave at dawn, before the sun comes up."

Maya stared at the tickets. "Kofi... this costs a fortune. How did you..."

"I'd do anything for you, Maya. Anything."`
  ),
  createLongStory(
    "whispers-of-the-past",
    "Whispers of the Past",
    "Anonymous",
    "romance",
    35,
    `Efua had always felt like a ghost in her own life. When she moved back to her grandmother's old house in the village, she expected peace and quiet. Instead, she found a hidden diary in the attic. 

The diary belonged to a girl named Araba, who lived there fifty years ago. As Efua read the pages, she realized Araba's story was terrifyingly similar to her own. Same heartbreak. Same lost love.

But the last page of the diary sent a chill down Efua's spine. It was a warning, written in frantic script: "He is coming back. Don't let him in."`
  ),
  createLongStory(
    "the-last-survivor",
    "The Last Survivor",
    "Anonymous",
    "normal",
    45,
    `The year was 2099. The world above was a toxic wasteland. 

Kofi was one of the few remaining humans, living in the underground bunker known as Sector 4. For ten years, he had followed the rules: don't go to the surface, don't ask questions, and trust the Elders.

But when a supply drone crashes into the bunker's ventilation shaft, Kofi finds a message hidden inside. It's a map, leading to a place called "Sanctuary." 

The problem? Sanctuary is rumored to be a myth. And the Elders will kill anyone who tries to leave.`
  ),
  createLongStory(
    "blood-on-the-campus",
    "Blood on the Campus",
    "Anonymous",
    "normal",
    30,
    `It was supposed to be a normal Friday night at St. Mary's University. But when the star athlete, David, was found unconscious in the locker room, the entire campus went into lockdown.

Amara, a journalism student, knew something was wrong. The police said it was an accident, but she saw the bruises on David's arms. 

Determined to find the truth, Amara started digging. But the deeper she went, the more she realized that everyone—from the coach to the Dean—was hiding something. And someone was willing to kill to keep the secret buried.`
  ),
  createLongStory(
    "the-billionaires-betrayal",
    "The Billionaire's Betrayal",
    "Anonymous",
    "romance",
    50,
    `Nana had signed the contract in a moment of desperation. Ten years of marriage to a man she barely knew, in exchange for saving her father's company.

Kwame was cold, ruthless, and obsessively private. He made it clear from day one: this was a business arrangement, not a romance. No feelings allowed.

But when a mysterious woman from Kwame's past shows up at their doorstep, Nana realizes her husband is hiding a dark secret. And the more she uncovers, the more she realizes that her fake husband might actually be falling for her... if he can survive the demons of his past.`
  )
];

// Colors for DARK mode
const darkColors = [
  '#1c2833', '#2c3e50', '#4b3832', '#2a4b41', '#3b2b4a', '#453f3c',
  '#223644', '#4a2c3a', '#1b4332', '#3e2723', '#1a2a3a', '#4a3b32'
];

// Colors for LIGHT mode (Soft pastels)
const lightColors = [
  '#fff1f2', '#f0f9ff', '#fdf4ff', '#f4f4f5', '#fefce8', '#f0fdf4',
  '#fff7ed', '#f8fafc', '#f5f3ff', '#ecfdf5', '#fef2f2', '#f3f4f6'
];

const listEl = document.getElementById("list");
const readerEl = document.getElementById("reader");
const readerTitle = document.getElementById("reader-title");
const readerMeta = document.getElementById("reader-meta");
const readerContent = document.getElementById("reader-content");

let currentFilter = "all";
let activeStory = null;
let currentChapterIndex = 0;

const prevBtn = document.getElementById("prev-chapter-btn");
const nextBtn = document.getElementById("next-chapter-btn");

function getColorForStory(index) {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const colorsArray = currentTheme === 'dark' ? darkColors : lightColors;
  return colorsArray[index % colorsArray.length];
}

function renderList() {
  listEl.innerHTML = "";

  const shown = stories.filter(s =>
    currentFilter === "all" ? true : s.category === currentFilter
  );

  if (!shown.length) {
    listEl.innerHTML = "<p>No stories here yet.</p>";
    return;
  }

  shown.forEach(story => {
    const card = document.createElement("article");
    card.className = "story-card";

    const originalIndex = stories.findIndex(s => s.id === story.id);
    const color = getColorForStory(originalIndex);
    card.style.backgroundColor = color;

    const title = document.createElement("h2");
    title.textContent = story.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${story.author || "Unknown"} • ${story.category} • ${story.chapters.length} Chapters`;

    const btn = document.createElement("button");
    btn.className = "read-btn";
    btn.textContent = "Read";
    btn.onclick = () => { location.hash = story.id; };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function renderChapter() {
  if (!activeStory) return;
  
  const chapter = activeStory.chapters[currentChapterIndex];
  
  readerContent.innerHTML = "";
  
  const chapterTitle = document.createElement("h3");
  chapterTitle.textContent = chapter.title;
  readerContent.appendChild(chapterTitle);
  
  chapter.content.split(/\n{2,}/).forEach(part => {
    if (!part.trim()) return;
    const p = document.createElement("p");
    p.textContent = part.trim();
    readerContent.appendChild(p);
  });

  prevBtn.disabled = currentChapterIndex === 0;
  nextBtn.disabled = currentChapterIndex === activeStory.chapters.length - 1;

  stopSpeech();
  window.scrollTo(0, 0);
}

function changeChapter(step) {
  currentChapterIndex += step;
  renderChapter();
}

function openStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) {
    location.hash = "";
    return;
  }

  mainHeader.classList.add("hidden");

  activeStory = story;
  currentChapterIndex = 0;

  listEl.classList.add("hidden");
  readerEl.style.display = "block";

  const originalIndex = stories.findIndex(s => s.id === story.id);
  const color = getColorForStory(originalIndex);
  readerEl.style.backgroundColor = color;

  readerTitle.textContent = story.title;
  readerMeta.textContent = `${story.author || "Unknown"} • ${story.category}`;

  renderChapter();
}

function showList() {
  stopSpeech();
  
  mainHeader.classList.remove("hidden");

  activeStory = null;
  readerEl.style.display = "none";
  listEl.classList.remove("hidden");
  renderList();
}

function route() {
  const id = location.hash.replace("#", "");
  if (id) openStory(id);
  else showList();
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList();
  });
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
