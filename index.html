    --header-bg: #ffffff;

  header {

    z-index: 10;
    transition: background-color 0.3s;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: .8rem;
  }

  h1 { margin: 0; font-size: 1.5rem; }
  
  #theme-toggle {

    color: var(--text);

    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;

    background: var(--btn-bg);
    color: var(--text);
    border: 1px solid var(--btn-border);
    border-radius: 999px;
    padding: .45rem 1rem;
    font-size: .95rem;
    cursor: pointer;
    transition: all 0.2s;

    color: var(--accent); 
    font-weight: bold;
  }

    padding: 1.2rem;
    margin: 0 0 1.2rem;

  .story-card h2 { margin: 0 0 .4rem; font-size: 1.2rem; color: var(--reader-text); }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: .8rem; }
  
  .read-btn { 
    background: var(--accent); 
    color: #111; 
    border: 0; 
    font-weight: 700; 
    padding: .5rem 1.2rem;

    cursor: pointer;

    gap: 10px;

    color: var(--text);

    padding: .5rem 1rem;

    color: var(--muted);
    border: 1px solid var(--btn-border);

// --- THEME TOGGLE LOGIC ---
const themeToggleBtn = document.getElementById('theme-toggle');
const htmlElement = document.documentElement;
const mainHeader = document.getElementById('main-header');

const savedTheme = localStorage.getItem('site-theme') || 'dark';
htmlElement.setAttribute('data-theme', savedTheme);
themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

themeToggleBtn.addEventListener('click', () => {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  
  htmlElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('site-theme', newTheme);
  themeToggleBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
  
  if (document.getElementById("list").classList.contains("hidden") === false) {
    renderList();
  }
});

// --- TEXT TO SPEECH LOGIC ---
const listenBtn = document.getElementById('listen-btn');
let isSpeaking = false;

function stopSpeech() {
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  isSpeaking = false;
  listenBtn.textContent = "🔊 Listen";
}

listenBtn.addEventListener('click', () => {
  if (!window.speechSynthesis) {
    alert("Sorry, your browser doesn't support text-to-speech.");
    return;
  }

  if (isSpeaking) {
    stopSpeech();
  } else {
    const textToRead = document.getElementById('reader-content').innerText;
    const utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.rate = 0.95; 
    
    utterance.onend = () => {
      isSpeaking = false;
      listenBtn.textContent = "🔊 Listen";
    };

    window.speechSynthesis.speak(utterance);
    isSpeaking = true;
    listenBtn.textContent = "⏹️ Stop";
  }
});

// --- HELPER FUNCTION FOR MASSIVE NOVELS ---
// This generates the chapter structure automatically so the code stays small enough to paste!
function createLongStory(id, title, author, category, totalChapters, firstChapterText) {
  const chapters = [];
  for (let i = 1; i <= totalChapters; i++) {
    chapters.push({
      title: `Chapter ${i}`,
      content: i === 1 ? firstChapterText : `This is Chapter ${i} of ${title}.\n\n(Note: Since a real novel of ${totalChapters} chapters would be thousands of pages long, this is placeholder text to show the structure. You can edit your index.html file on GitHub and replace this text with your actual story!)`
    });
  }
  return { id, title, author, category, chapters };
}

function getColorForStory(index) {
  const currentTheme = htmlElement.getAttribute('data-theme');
  const colorsArray = currentTheme === 'dark' ? darkColors : lightColors;
  return colorsArray[index % colorsArray.length];
}

function renderList() {
  listEl.innerHTML = "";

  const shown = stories.filter(s =>

  );

  if (!shown.length) {
    listEl.innerHTML = "<p>No stories here yet.</p>";
    return;
  }

  shown.forEach(story => {
    const card = document.createElement("article");
    card.className = "story-card";

    const originalIndex = stories.findIndex(s => s.id === story.id);
    const color = getColorForStory(originalIndex);
    card.style.backgroundColor = color;

    const title = document.createElement("h2");
    title.textContent = story.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${story.author || "Unknown"} • ${story.category} • ${story.chapters.length} Chapters`;

    const btn = document.createElement("button");
    btn.className = "read-btn";
    btn.textContent = "Read";
    btn.onclick = () => { location.hash = story.id; };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function renderChapter() {
  if (!activeStory) return;
  
  const chapter = activeStory.chapters[currentChapterIndex];
  
  readerContent.innerHTML = "";
  
  const chapterTitle = document.createElement("h3");
  chapterTitle.textContent = chapter.title;
  readerContent.appendChild(chapterTitle);
  
  chapter.content.split(/\n{2,}/).forEach(part => {
    if (!part.trim()) return;
    const p = document.createElement("p");
    p.textContent = part.trim();
    readerContent.appendChild(p);
  });

  prevBtn.disabled = currentChapterIndex === 0;
  nextBtn.disabled = currentChapterIndex === activeStory.chapters.length - 1;

  stopSpeech();
  window.scrollTo(0, 0);
}

function changeChapter(step) {
  currentChapterIndex += step;
  renderChapter();
}

function openStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) {
    location.hash = "";
    return;
  }

  // HIDE THE HEADER HERE
  mainHeader.classList.add("hidden");

  activeStory = story;
  currentChapterIndex = 0;

  listEl.classList.add("hidden");
  readerEl.style.display = "block";

  const originalIndex = stories.findIndex(s => s.id === story.id);
  const color = getColorForStory(originalIndex);
  readerEl.style.backgroundColor = color;

  readerTitle.textContent = story.title;
  readerMeta.textContent = `${story.author || "Unknown"} • ${story.category}`;

  renderChapter();
}

function showList() {
  stopSpeech();
  
  // SHOW THE HEADER HERE
  mainHeader.classList.remove("hidden");

  activeStory = null;
  readerEl.style.display = "none";
  listEl.classList.remove("hidden");
  renderList();
}

function route() {
  const id = location.hash.replace("#", "");
  if (id) openStory(id);
  else showList();
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList();
  });
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
