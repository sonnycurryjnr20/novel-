<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friends novel shelf</title>
<style>
  :root {
    --bg: #111;
    --card: #1c1c1c;
    --text: #eee;
    --muted: #aaa;
    --accent: #ff8ab3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 1.2rem;
    border-bottom: 1px solid #333;
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  h1 { margin: 0 0 .6rem; font-size: 1.4rem; }
  .filters { display: flex; gap: .5rem; flex-wrap: wrap; }
  button {
    background: var(--card);
    color: var(--text);
    border: 1px solid #444;
    border-radius: 999px;
    padding: .45rem .8rem;
    font-size: .95rem;
  }
  button.active { border-color: var(--accent); color: var(--accent); }
  main { padding: 1rem; max-width: 800px; margin: auto; }
  .story-card {
    background: var(--card);
    border: 1px solid #333;
    border-radius: 14px;
    padding: 1rem;
    margin: 0 0 1rem;
  }
  .story-card h2 { margin: 0 0 .3rem; font-size: 1.1rem; }
  .meta { color: var(--muted); font-size: .9rem; margin-bottom: .6rem; }
  .read-btn { background: var(--accent); color: #111; border: 0; font-weight: 700; }
  #reader { display: none; }
  #reader h2 { margin-top: 0; }
  #reader p { margin: 0 0 1rem; }
  .back { margin-bottom: 1rem; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>📚 Friends' Novel Shelf</h1>
  <div class="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="romance">Romance</button>
    <button class="filter" data-filter="normal">Normal</button>
  </div>
</header>

<main>
  <section id="list"></section>

  <section id="reader">
    <button class="back" onclick="location.hash=''">← Back to shelf</button>
    <h2 id="reader-title"></h2>
    <div class="meta" id="reader-meta"></div>
    <div id="reader-content"></div>
  </section>
</main>

<script>
// Add your stories here.
// category must be "romance" or "normal".
const stories = [
  {
    id: "moonlight-letters",
    title: "Moonlight Letters",
    author: "You",
    category: "romance",
    content: `The first letter arrived on a Tuesday.

She didn't know who sent it, but the handwriting looked familiar.

Every week, another letter came. Every week, she fell a little more in love with the stranger behind the ink.`
  },
  {
    id: "the-forest-road",
    title: "The Forest Road",
    author: "Your Friend",
    category: "normal",
    content: `The road through the forest was quiet.

Too quiet.

He checked his phone. No signal. The trees seemed taller than they had been a minute ago.

Then he heard footsteps behind him.`
  }{
    id: "the-library-lights",
    title: "Library Lights",
    author: "AI Scene",
    category: "romance",
    content: `The SHS library was supposed to close at 6:00 PM, but the storm outside had other plans. The rain battered against the high windows, trapping Kofi and Amara inside with nothing but the hum of the old air conditioner and the smell of dusty textbooks.

"Looks like we're stuck," Amara whispered, looking up from her Further Mathematics textbook.

Kofi looked up from his seat across the table. He had been trying to focus on his Physics notes, but his eyes kept drifting to the way Amara bit her pen when she was concentrating. "I guess so. At least the lights are still on."

A sudden crack of thunder shook the building. The fluorescent lights above them flickered violently, and then everything went pitch black.

Amara let out a small gasp. 

"Hey, it's okay," Kofi said, his voice suddenly closer. She heard his chair scrape against the floor. A moment later, the soft white glow of his phone screen illuminated his face. He was standing right beside her. 

"You're not scared of the dark, are you?" he teased gently, sitting down in the chair next to her.

"No," Amara lied, but she instinctively moved her arm closer to his. "I just... don't like thunder."

Kofi smiled. Under the glow of his phone, his eyes looked softer than they did in the bright daylight of the classroom. "I can distract you. What chapter are you on?"

"Chapter 4. Vectors," she sighed. "It's impossible."

"Let me see," Kofi said. He leaned in closer, his shoulder brushing against hers. As he pointed at the complex equations on the page, Amara realized she couldn't focus on a single number. She was entirely focused on the warmth of his shoulder, and the way his voice sounded in the dark, quiet room.

"Actually," Kofi murmured, looking away from the book and directly into her eyes, "I've been trying to find the courage to talk to you outside of class for weeks. So maybe... this storm is a good thing."`
  },
  {
    id: "the-silent-student",
    title: "The Silent Student",
    author: "AI Scene",
    category: "normal",
    content: `There was a rumor going around Form 3 Science that the new student, Ekow, hadn't spoken a single word since he transferred two weeks ago. 

Kwame didn't believe in rumors. He sat next to Ekow in Chemistry class, and he had tried everything: jokes, asking for a pen, complaining about the strict teacher. Ekow would just nod, smile faintly, and stare back down at his notebook.

But today, Kwame noticed something strange.

The teacher had stepped out of the classroom to take a call, leaving the students to work on their titration experiment. The room was a chaotic mess of clinking glass and hushed whispers. 

Kwame accidentally knocked his beaker off the edge of the desk. Time seemed to slow down as the glass tumbled toward the hard floor. 

Before Kwame could even flinch, a hand shot out and caught the beaker an inch from the ground. 

It was Ekow. 

But that wasn't what made Kwame freeze. It was what Ekow did next. He placed the beaker back on the desk, looked directly at Kwame, and spoke. 

"Your concentration is off," Ekow said. His voice was surprisingly deep and calm. "You're using the wrong indicator."

Kwame blinked. "You... you can talk?"

Ekow didn't answer. He simply pushed his own notebook across the desk. Kwame looked down at the page. It wasn't chemistry notes. It was a detailed map of the school's underground drainage system, covered in red ink and strange symbols. 

"Keep your voice down," Ekow whispered, his eyes darting to the classroom door. "I need your help. The school isn't what you think it is. They're watching the science block tonight."

Before Kwame could ask a single question, the classroom door swung open, and the Chemistry teacher walked back in. Ekow instantly pulled the notebook back, resumed his silent, staring posture, and picked up his pipette. 

Kwame looked at his own hands. They were shaking. He realized that sitting next to the quietest kid in school might just be the most dangerous thing he had ever done.`
  }
];

const listEl = document.getElementById("list");
const readerEl = document.getElementById("reader");
const readerTitle = document.getElementById("reader-title");
const readerMeta = document.getElementById("reader-meta");
const readerContent = document.getElementById("reader-content");

let currentFilter = "all";

function renderList() {
  listEl.innerHTML = "";

  const shown = stories.filter(s =>
    currentFilter === "all" ? true : s.category === currentFilter
  );

  if (!shown.length) {
    listEl.innerHTML = "<p>No stories here yet.</p>";
    return;
  }

  shown.forEach(story => {
    const card = document.createElement("article");
    card.className = "story-card";

    const title = document.createElement("h2");
    title.textContent = story.title;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `${story.author || "Unknown"} • ${story.category}`;

    const btn = document.createElement("button");
    btn.className = "read-btn";
    btn.textContent = "Read";
    btn.onclick = () => { location.hash = story.id; };

    card.appendChild(title);
    card.appendChild(meta);
    card.appendChild(btn);
    listEl.appendChild(card);
  });
}

function openStory(id) {
  const story = stories.find(s => s.id === id);
  if (!story) {
    location.hash = "";
    return;
  }

  listEl.classList.add("hidden");
  readerEl.style.display = "block";

  readerTitle.textContent = story.title;
  readerMeta.textContent = `${story.author || "Unknown"} • ${story.category}`;

  readerContent.innerHTML = "";
  story.content.split(/\n{2,}/).forEach(part => {
    if (!part.trim()) return;
    const p = document.createElement("p");
    p.textContent = part.trim();
    readerContent.appendChild(p);
  });

  window.scrollTo(0, 0);
}

function showList() {
  readerEl.style.display = "none";
  listEl.classList.remove("hidden");
  renderList();
}

function route() {
  const id = location.hash.replace("#", "");
  if (id) openStory(id);
  else showList();
}

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    currentFilter = btn.dataset.filter;
    document.querySelectorAll(".filter").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderList();
  });
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
